<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inxee HR OS • Notion Workspace</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Notion Theme Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="notion-layout">
    
    <!-- Collapsible Notion Left Sidebar -->
    <aside class="notion-sidebar" id="notionSidebar">
      
      <!-- Workspace Switcher Header -->
      <div class="sidebar-header">
        <div class="workspace-pill" onclick="switchRoleToggle()">
          <div class="workspace-icon" id="sidebarWsIcon">IX</div>
          <div>
            <div style="font-size: 13px; font-weight: 600; line-height: 1.2;" id="sidebarWsTitle">Inxee HR OS</div>
            <div style="font-size: 11px; color: var(--notion-text-muted);" id="sidebarWsSubtitle">Employee View</div>
          </div>
          <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px; color: var(--notion-text-subtle);"></i>
        </div>
        <div class="sidebar-actions">
          <button class="icon-btn" onclick="toggleSidebar()" title="Collapse Sidebar"><i class="fa-solid fa-angles-left"></i></button>
        </div>
      </div>

      <!-- Quick Actions -->
      <div style="padding: 0 8px; margin-bottom: 8px;">
        <div class="sidebar-item" onclick="openSearchModal()">
          <span class="item-emoji"><i class="fa-solid fa-magnifying-glass" style="font-size: 13px;"></i></span>
          <span>Quick Search</span>
          <span class="item-badge" style="font-family: 'JetBrains Mono', monospace;">Ctrl K</span>
        </div>
        <div class="sidebar-item" onclick="toggleTheme()">
          <span class="item-emoji"><i class="fa-solid fa-circle-half-stroke" style="font-size: 13px;"></i></span>
          <span id="themeToggleLabel">Dark Mode</span>
        </div>
      </div>

      <!-- Navigation Pages Section -->
      <div class="sidebar-section-title">WORKSPACE PAGES</div>
      <ul class="sidebar-menu" id="sidebarNavList">
        <!-- Dynamically rendered based on Employee or Admin view -->
      </ul>

      <!-- User Profile Bar at Bottom -->
      <div class="sidebar-footer">
        <div class="user-profile-bar" onclick="navigatePage('profile')">
          <img src="https://images.unsplash.com/photo-1517423738875-5ce310acd3da?auto=format&fit=crop&w=300&q=80" id="sidebarUserAvatar" class="user-avatar" alt="Avatar">
          <div style="overflow: hidden;">
            <div class="user-meta-name" id="sidebarUserName">Deepanshu Garhkoti</div>
            <div class="user-meta-role" id="sidebarUserRole">SDE Intern</div>
          </div>
        </div>
        <button class="icon-btn" onclick="switchRoleToggle()" title="Switch Role / View"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
      </div>

    </aside>

    <!-- Main Workspace Container -->
    <main class="notion-main">
      
      <!-- Notion Top Navigation Bar -->
      <header class="notion-topbar">
        <div class="breadcrumbs">
          <button class="icon-btn" id="sidebarExpandBtn" style="display: none;" onclick="toggleSidebar()" title="Expand Sidebar">
            <i class="fa-solid fa-bars"></i>
          </button>
          <span class="breadcrumb-link" onclick="navigatePage('overview')">Inxee Systems</span>
          <span>/</span>
          <span style="color: var(--notion-text); font-weight: 500;" id="topbarPageTitle">Overview</span>
        </div>

        <div class="topbar-controls">
          <button class="role-switcher-btn" onclick="switchRoleToggle()">
            <i class="fa-solid fa-shuffle" style="font-size: 11px; color: var(--notion-blue);"></i>
            <span id="topbarRoleLabel">Switch to Admin Mode</span>
          </button>
          <button class="icon-btn" title="Share & Export" onclick="alert('Exporting Notion Page Workspace...')"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
          <button class="icon-btn" title="Page Options" onclick="openSearchModal()"><i class="fa-solid fa-ellipsis"></i></button>
        </div>
      </header>

      <!-- Notion Scrollable Page Canvas -->
      <section class="notion-canvas" id="notionCanvas">
        <!-- Dynamic Notion Content Rendered Here -->
      </section>

    </main>

  </div>

  <!-- Notion Modal Overlay -->
  <div id="modalContainer"></div>

  <!-- Notion Workspace Engine Script -->
  <script src="app.js"></script>
</body>
</html>
